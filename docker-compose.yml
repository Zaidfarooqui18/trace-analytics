version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: trace_analytics_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: trace_analytics
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: trace_analytics_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/trace_analytics
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3001
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: trace_analytics_client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
